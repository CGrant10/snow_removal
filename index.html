<!-- The reservation form used to live here. It moved into reserve/ so the
     two apps stop sharing an install scope; see sw-core.js. This page has
     no manifest on purpose — it must not be installable itself, or it
     would claim the whole site's scope all over again.

     Old installs still start here, and their scope covers reserve/, so
     they land in the form and keep working. -->
<meta http-equiv="refresh" content="0; url=reserve/">
<script>location.replace("reserve/" + location.search + location.hash);</script>

<style>
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: #eef2f8; color: #3d4d68;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center; padding: 24px;
  }
  a { color: #1462c9; }
</style>
</head>
<body>

     <a href="reserve/">Continue</a></p>
