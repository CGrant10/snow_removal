<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job board</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#10233f">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body class="adminBody">

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-flake" viewBox="0 0 24 24">
    <path d="M12 2.6 20.1 7.3v9.4L12 21.4 3.9 16.7V7.3Z"/>
    <path d="M12 7.6v8.8"/><path d="M8.2 9.8 15.8 14.2"/><path d="M15.8 9.8 8.2 14.2"/>
  </symbol>
  <symbol id="i-phone" viewBox="0 0 24 24">
    <path d="M8.1 3.6h-2A2.1 2.1 0 0 0 4 5.9C4 13.7 10.3 20 18.1 20a2.1 2.1 0 0 0 2.3-2.1v-2l-4.3-1.4-1.7 2.1a13.6 13.6 0 0 1-5-5l2.1-1.7Z"/>
  </symbol>
  <symbol id="i-msg" viewBox="0 0 24 24">
    <path d="M20.4 12.4a7.6 7.6 0 0 1-8.2 7.5L5.4 21l1.1-4.6a7.6 7.6 0 1 1 13.9-4Z"/>
  </symbol>
  <symbol id="i-pin" viewBox="0 0 24 24">
    <path d="M12 21s6.4-5.6 6.4-10.2a6.4 6.4 0 1 0-12.8 0C5.6 15.4 12 21 12 21Z"/>
    <circle cx="12" cy="10.6" r="2.3"/>
  </symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24">
    <path d="M20 12a8 8 0 1 1-2.5-5.8"/>
    <path d="M20.4 4.4v4.2h-4.2"/>
  </symbol>
</svg>

<!-- ================================================ passphrase gate -->
<div class="gate" id="gate">
  <div class="gateCard">
    <span class="mark"><svg class="markIcon"><use href="#i-flake"></use></svg></span>
    <h1>Job board</h1>
    <p class="muted">Staff only. Customers use the reservation form.</p>

    <label class="field">
      <span>Passphrase</span>
      <input type="password" id="pass" autocomplete="current-password">
    </label>

    <label class="check">
      <input type="checkbox" id="remember" checked>
      <span>Stay signed in on this device</span>
    </label>

    <p class="err" id="gateErr" hidden></p>
    <button class="btn primary wide" id="gateBtn">Open the board</button>
  </div>
</div>

<!-- ================================================ board -->
<div class="board" id="board" hidden>

  <header class="adminBar">
    <div class="brand">
      <span class="mark"><svg class="markIcon"><use href="#i-flake"></use></svg></span>
      <div>
        <h1>Job board</h1>
        <p class="muted sm" id="counts"></p>
      </div>
    </div>
    <div class="topActions">
      <button class="iconBtn" id="refreshBtn" title="Refresh">
        <svg class="rf"><use href="#i-refresh"></use></svg>
      </button>
      <button class="callbtn" id="signOut">Sign out</button>
    </div>
  </header>

  <div class="adminTools">
    <div class="chips" id="statusFilter"></div>
    <input type="search" id="search" placeholder="Search name, address, phone…">
  </div>

  <main class="jobs" id="jobs"></main>

  <p class="empty" id="empty" hidden></p>

  <p class="verLine always">
    <button id="appVersion" class="verBtn" title="Check for updates"></button>
  </p>
</div>

<button class="updatePill" id="updatePill" hidden>Update available — tap to install</button>

<script src="config.js"></script>
<script src="updater.js"></script>
<script src="admin.js"></script>
</body>
</html>
